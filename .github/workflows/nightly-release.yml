name: Nightly prerelease

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/build.mjs"
      - ".node-version"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/nightly-release.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-prerelease
  cancel-in-progress: true

jobs:
  release:
    name: Nightly prerelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Check whether Nightly is current
        id: nightly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_sha="$(git ls-remote --tags origin refs/tags/nightly | cut -f1)"
          archive_name="$(gh release view nightly --json assets --jq \
              '.assets[] | select(.name == "userChrome.js-Loader-nightly.zip") | .name' \
              2> /dev/null || true)"
          if [[ "${current_sha}" == "${GITHUB_SHA}" && \
                "${archive_name}" == "userChrome.js-Loader-nightly.zip" ]]; then
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              echo "Nightly already points to ${GITHUB_SHA}; skipping publication."
          else
              echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create archive
        if: steps.nightly.outputs.publish == 'true'
        working-directory: dist
        run: zip -r userChrome.js-Loader-nightly.zip userChrome.js-Loader

      - name: Publish prerelease
        if: steps.nightly.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_name="nightly"
          archive_path="dist/userChrome.js-Loader-nightly.zip"
          release_notes="dist/nightly-notes.md"

          git tag -f "${tag_name}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag_name}" --force

          cat > "${release_notes}" << EOF
          Automated nightly prerelease for commit ${GITHUB_SHA}.

          Branch: ${GITHUB_REF_NAME}
          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF

          if gh release view "${tag_name}" > /dev/null 2>&1; then
              gh release edit "${tag_name}" \
                  --title "Nightly build" \
                  --notes-file "${release_notes}" \
                  --prerelease \
                  --latest=false

              gh release upload "${tag_name}" "${archive_path}" --clobber
          else
              gh release create "${tag_name}" \
                  "${archive_path}" \
                  --title "Nightly build" \
                  --notes-file "${release_notes}" \
                  --prerelease \
                  --latest=false \
                  --verify-tag
          fi
