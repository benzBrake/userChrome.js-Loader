name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Create archive
        working-directory: dist
        run: zip -r userChrome.js-Loader-ci.zip userChrome.js-Loader

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: userChrome.js-Loader-${{ github.sha }}
          path: dist/userChrome.js-Loader-ci.zip
          if-no-files-found: error
          retention-days: 7
